# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 监控目标配置
#
# defaultPackage  —— 应用首次启动时的默认监控目标（在界面里可随时切换）
# candidates      —— 可选的目标清单（逗号分隔）
#
# 注意：candidates 必须与 app/src/main/AndroidManifest.xml 里 <queries> 的
#      <package> 列表保持一致。Android 11+ 只能查询到 manifest 声明过的包，
#      没声明的包查询结果与"未安装"无法区分，所以清单必须提前列出。
# ---------------------------------------------------------------------------
appwatch.defaultPackage=com.mobiletools.systemhelper
appwatch.defaultName=SystemHelper

appwatch.candidates=com.mobiletools.systemhelper,com.miui.systemAdSolution,com.miui.analytics,com.miui.msa.global,com.xiaomi.mipicks,com.miui.hybrid,com.miui.video,com.miui.news,com.miui.browser,com.xiaomi.gamecenter,com.xiaomi.gsgservice,com.miui.miservice,com.xiaomi.market,com.iflytek.inputmethod.miui,com.miui.cleanmaster
